# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM settings for the Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Performance: Enable parallel project execution and caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style: "official"
kotlin.code.style=official

# Modern AGP behavior:
# Enables namespacing of each library's R class (improves build speed)
android.nonTransitiveRClass=true

# Enable the new DSL (Required for AGP 9.0+ to avoid deprecation warnings)
android.newDsl=true

# Enforce unique package names for all modules
android.uniquePackageNames=true

# R8 Full Mode: Aggressive optimizations for smaller APKs
android.r8.strictFullModeForKeepRules=true

# Optimization: Only generate R classes for the app at compile time
android.enableAppCompileTimeRClass=false

# Dependency resolution behavior
android.dependency.useConstraints=true

# Modern AGP defaults: resValues is disabled by default for better performance.
# Enable it in specific build.gradle modules if needed via buildFeatures { resValues = true }
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=true
android.experimental.legacy.android.extension=true
android.disallowKotlinSourceSets=false
