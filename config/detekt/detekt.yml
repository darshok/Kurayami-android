build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # complexity: 2
    # LongParameterList: 1
    # style: 1
    # comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  # when writing own rules with transitive dependencies, read: https://detekt.dev/docs/rulesets/custom-rulesets
  # exclude:
  #   - '**/test/**'
  #   - '**/androidTest/**'

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

output-reports:
  active: true
  exclude:
  # - 'HtmlOutputReport'
  # - 'TxtOutputReport'
  # - 'XmlOutputReport'
  # - 'SarifOutputReport'

# Custom Rules for Compose (io.nlopez.compose.rules)
Compose:
  active: true
  ComposableFunctionName:
    active: true
  ComposableEventParameterNaming:
    active: true
  ModifierParameterPosition:
    active: true
  ModifierDefaultValue:
    active: true
  ReusedModifierInstance:
    active: true
  UnnecessaryEventHandlerParameter:
    active: true
  ComposableParametersOrdering:
    active: true
  ModifierHeightWithText:
    active: true
  ContentEmitterReturningValues:
    active: true
  ModifierOrder:
    active: true
  MultipleContentEmitters:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  UnstableCollections:
    active: true

# Formatting Rules
formatting:
  active: true
  android: true
  autoCorrect: true
  ParameterListWrapping:
    active: true
    indentSize: 4
  Indentation:
    active: true
    indentSize: 4
  NoWildcardImports:
    active: true
  FinalNewline:
    active: true

# Standard Rulesets
complexity:
  active: true
  LongParameterList:
    active: true
    # Composables often have many parameters due to hoisting
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
    functionThreshold: 15
  TooManyFunctions:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 30
    ignoreAnnotatedFunctions: ['Preview']
  LargeClass:
    active: true
    threshold: 600

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotationArguments: true
    ignoreEnums: true
    ignoreNamedParameters: true
    # Common Compose numbers like DP or weights
    ignoreAnnotated: ['Composable']
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: ['Preview']
  ReturnCount:
    active: true
    max: 3
    excludedFunctions: 'equals'
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: false

naming:
  active: true
  FunctionNaming:
    active: true
    # Composable functions often use PascalCase (returning Unit)
    # allowing both camelCase and PascalCase
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '.*'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    # Compose prefers PascalCase for top-level constants
    constantPattern: '[A-Z][A-Za-z0-9]*'
