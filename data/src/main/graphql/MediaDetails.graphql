query MediaDetails($id: Int) {
  Media(id: $id) {
    id
    title {
      userPreferred
      romaji
      english
      native
    }
    coverImage {
      extraLarge
      large
      medium
      color
    }
    bannerImage
    type
    format
    status
    episodes
    chapters
    volumes
    averageScore
    meanScore
    popularity
    genres
    description(asHtml: false)
    startDate {
      year
      month
      day
    }
    endDate {
      year
      month
      day
    }
    season
    seasonYear
    favourites
    trending
    tags {
      id
      name
      description
      category
      rank
      isGeneralSpoiler
      isMediaSpoiler
    }
    relations {
      edges {
        id
        relationType
        node {
          id
          title {
            userPreferred
          }
          format
          type
          status
          coverImage {
            medium
          }
        }
      }
    }
  }
}
